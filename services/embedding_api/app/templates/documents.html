<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>Document Register</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="container">

<h1>文書登録</h1>

<label>Document ID</label>

<input

    id="documentId"

    type="text"

    placeholder="html001"

/>

<label>Document</label>

<textarea

    id="documentText"

    rows="15"

    placeholder="ここへ文章を貼り付けます"

></textarea>

<button

    onclick="registerDocument()"

>

登録

</button>

<pre id="result"></pre>

<p>

<a href="/">戻る</a>

</p>

<script src="/static/js/documents.js"></script>

</div>

</body>

</html>
