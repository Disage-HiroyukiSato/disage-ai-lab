worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format structured escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"remote_addr":"$remote_addr","request_time":$request_time}';

    access_log /dev/stdout structured;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 10m;

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway","auth":"disabled"}';
        }

        location /api/ {
            return 404;
        }

        location ~ ^/(embedding|documents|query|history|retrieval)(/|$) {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://embedding-api:8010;
        }

        location = /health {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_pass http://embedding-api:8010;
        }

        location = /ready {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_pass http://embedding-api:8010;
        }

        location ~ ^/(docs|redoc|openapi.json)(/|$) {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_pass http://embedding-api:8010;
        }

        location / {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            set $ui_upstream http://ui:8080;
            proxy_pass $ui_upstream;
        }
    }
}
