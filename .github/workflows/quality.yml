name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/embedding_api/requirements-test.txt
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.12.9 pip-audit==2.9.0
      - name: Ruff
        run: ruff check services/embedding_api
      - name: Dependency audit
        run: pip-audit -r services/embedding_api/requirements.txt
      - name: Validate Compose interpolation
        run: |
          cp .env.example .env
          cp config/database.env.example config/database.env
          cp config/auth.env.example config/auth.env
          docker compose -f compose/docker-compose.yml config --quiet
          docker compose -f compose/docker-compose-test.yml config --quiet
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/embedding_api/requirements-test.txt
      - name: Install dependencies
        working-directory: services/embedding_api
        run: pip install -r requirements-test.txt
      - name: Test
        working-directory: services/embedding_api
        env:
          EMBEDDING_MODEL: BAAI/bge-m3
          CHUNK_SIZE: "500"
          CHUNK_OVERLAP: "100"
          CHROMA_HOST: localhost
          CHROMA_PORT: "8000"
          CHROMA_COLLECTION: java_training
          REQUEST_TIMEOUT: "30"
          RETRIEVAL_CANDIDATE_SIZE: "20"
          DEFAULT_LIMIT: "5"
          MAX_DISTANCE: "0.80"
          RERANK_MODEL: BAAI/bge-reranker-base
          LOG_LEVEL: INFO
          LOG_PROMPT: "false"
          LOG_SQL: "false"
        run: pytest -m "not model" --cov=app --cov-report=term-missing

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/embedding_api/Dockerfile
