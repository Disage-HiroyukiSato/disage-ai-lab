worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format structured escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"remote_addr":"$remote_addr","user":"$upstream_http_x_auth_request_user",'
        '"request_time":$request_time}';

    access_log /dev/stdout structured;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 10m;

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location /oauth2/ {
            proxy_pass http://oauth2-proxy:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }

        location = /oauth2/auth {
            proxy_pass http://oauth2-proxy:4180;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            auth_request /oauth2/auth;
            error_page 401 =403 /oauth2/sign_in;

            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            auth_request_set $auth_access_token $upstream_http_x_auth_request_access_token;
            auth_request_set $auth_authorization $upstream_http_authorization;

            proxy_set_header X-Authenticated-User $auth_user;
            proxy_set_header X-Authenticated-Email $auth_email;
            proxy_set_header X-Access-Token $auth_access_token;
            proxy_set_header Authorization $auth_authorization;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://embedding-api:8010;
        }
    }
}
