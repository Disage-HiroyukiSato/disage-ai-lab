<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Phase17 AI Assistant</title>

    <!-- Mermaid 必須 -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: true });
    </script>

    <!-- 新しいUI用CSS（第2部で提示） -->
    <link rel="stylesheet" href="/static/css/new-style.css">
</head>

<body>

<div class="layout">

    <!-- ============================
         サイドバー
    ============================= -->
    <aside class="sidebar">

        <h2>⚙️ 設定</h2>

        <label>受講生ID（任意）</label>
        <input id="studentId" type="text" placeholder="student-001">

        <label>セッションID</label>
        <input id="sessionId" type="text" readonly>

        <button class="new-session-btn" onclick="resetSession()">
            🔄 新しい会話
        </button>

        <h3>📝 会話履歴</h3>
        <div id="history" class="history-box"></div>

    </aside>


    <!-- ============================
         メイン画面（LLMチャット風）
    ============================= -->
    <main class="main">

        <!-- 質問入力欄（ChatGPT風） -->
        <div class="chat-input-box">
            <textarea
                id="question"
                placeholder="例：HTMLとは？"
                rows="3"
            ></textarea>

            <button class="ask-btn" onclick="askQuestion()">
                🚀 質問する
            </button>
        </div>

        <!-- 回答表示 -->
        <section class="answer-section">
            <h2>🧠 回答</h2>
            <div id="answer" class="answer-area"></div>
        </section>

        <!-- 検索情報 -->
        <section class="info-section">
            <h2>🔍 検索情報</h2>

            <table class="info-table">
                <tr>
                    <td>検索時間</td>
                    <td id="elapsed"></td>
                </tr>
                <tr>
                    <td>取得件数</td>
                    <td id="retrieved"></td>
                </tr>
                <tr>
                    <td>教材外判定</td>
                    <td id="offTopic"></td>
                </tr>
            </table>
        </section>

        <!-- 検索結果（RAGドキュメント） -->
        <section class="documents-section">
            <h2>📄 検索結果</h2>
            <div id="documents"></div>
        </section>

        <p class="back-link">
            <a href="/">← 戻る</a>
        </p>

    </main>

</div>

<script src="/static/js/query.js"></script>
</body>
</html>
